<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary - Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/favico.png">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">Expense Tracker</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/expense">Expense</a>
                <a class="nav-link active" aria-current="page" href="/summary">Summary</a>
                <a class="nav-link" href="/insights">Insights</a>
            </div>
            <div class="navbar-nav ms-auto">
                <button class="btn btn-outline-secondary btn-sm" id="settings-btn" title="Settings">
                    <i class="bi bi-gear-fill"></i>
                </button>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <h1 class="mb-4 text-center">Financial Summary</h1>

        <!-- Key Metrics Cards -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3">
                    <div class="text-muted small">Total Spend (This Month)</div>
                    <h3 id="metric-total-current">-</h3>
                    <div id="metric-change" class="small">-</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3">
                    <div class="text-muted small">Top Category</div>
                    <h3 id="metric-top-category">-</h3>
                    <div id="metric-top-value" class="small">-</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm text-center p-3">
                    <div class="text-muted small">Avg. Monthly Spend</div>
                    <h3 id="metric-avg">-</h3>
                    <div class="small text-muted">(Last 6 Months)</div>
                </div>
            </div>
        </div>

        <div class="row gy-4">
            <!-- Main Stacked Area Chart -->
            <div class="col-lg-8">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Spending Trends</h5>
                        <div class="chart-container" style="position: relative; height:400px; width:100%">
                            <canvas id="trends-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Current Month Breakdown -->
            <div class="col-lg-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title">Category Breakdown (Current)</h5>
                        <div class="chart-container" style="position: relative; height:400px; width:100%">
                            <canvas id="breakdown-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="category-charts" class="row gy-4 d-none"></div> <!-- Hidden, kept for compatibility -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="/settings.js"></script>
    <script type="module">
        import { initSettings, openSettingsModal } from '/settings.js';
        import { createSummaryApp } from '/summary/summary.js';
        initSettings();
        document.getElementById('settings-btn')?.addEventListener('click', openSettingsModal);
        const app = createSummaryApp({
            monthPicker: document.getElementById('month-picker'),
            loadingSpinner: document.getElementById('loading-spinner'),
            errorMessage: document.getElementById('error-message'),
            statsCards: document.getElementById('stats-cards'),
            doughnutCanvas: document.getElementById('doughnut-chart'),
            totalCanvas: document.getElementById('total-chart'),
            categoryChartsDiv: document.getElementById('category-charts'),
            comparisonCanvas: document.getElementById('comparison-chart'),
            categoryTableSection: document.getElementById('category-table-section'),
            categoryTableBody: document.getElementById('category-table-body'),
            topTransactionsSection: document.getElementById('top-transactions-section'),
            topTransactionsBody: document.getElementById('top-transactions-body'),
            ytdSection: document.getElementById('ytd-section'),
            ytdMonthlyCanvas: document.getElementById('ytd-monthly-chart'),
            ytdCategoryCanvas: document.getElementById('ytd-category-chart'),
        });
        app.init();
    </script>
</body>
</html>
